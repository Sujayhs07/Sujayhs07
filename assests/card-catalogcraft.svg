<svg xmlns="http://www.w3.org/2000/svg" width="900" height="211" viewBox="0 0 900 211" role="img" aria-label="CatalogCraft AI project card">
  <title>CatalogCraft AI</title>
  <defs>
    <clipPath id="round"><rect width="900" height="211" rx="18"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3.5"/></filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.10"/>
    </pattern>
    <radialGradient id="spot">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glare" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0">
      <stop offset="0" stop-color="#ec4899"/>
      <stop offset="0.5" stop-color="#f9a8d4"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="320" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#f9a8d4"/>
      <stop offset="0.5" stop-color="#ec4899"/>
      <stop offset="0.6" stop-color="#f9a8d4"/>
      <stop offset="1" stop-color="#ffffff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="320 0" dur="3.6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="iconbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#f9a8d4"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#round)">
    <rect width="900" height="211" fill="#0d1117"/>

    <!-- aurora -->
    <g filter="url(#blur)">
      <ellipse cx="160" cy="73.85" rx="190" ry="70" fill="#ec4899" opacity="0.30">
        <animate attributeName="cx" values="160;620;160" dur="13s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="73.85;126.6;73.85" dur="9s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="760" cy="158.25" rx="170" ry="60" fill="#f9a8d4" opacity="0.18">
        <animate attributeName="cx" values="760;260;760" dur="15s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <rect width="900" height="211" fill="url(#dots)"/>

    <!-- moving spotlight -->
    <circle cx="150" cy="105.5" r="190" fill="url(#spot)">
      <animate attributeName="cx" values="120;780;120" dur="11s" repeatCount="indefinite"/>
    </circle>

    <circle cx="263" cy="163" r="1.2" fill="#ffffff" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.8;0.05" dur="3.6s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="163;155;163" dur="5.6s" begin="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="660" cy="160" r="0.8" fill="#ffffff" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.8;0.05" dur="2.5s" begin="3.3s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="160;152;160" dur="4.5s" begin="3.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="285" cy="153" r="0.9" fill="#ffffff" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.8;0.05" dur="5.5s" begin="1.9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="153;145;153" dur="7.5s" begin="1.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="876" cy="152" r="1.2" fill="#ffffff" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.8;0.05" dur="4.4s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="152;144;152" dur="6.4s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="670" cy="50" r="1.6" fill="#ffffff" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.8;0.05" dur="4.1s" begin="3.0s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="50;42;50" dur="6.1s" begin="3.0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="707" cy="28" r="0.9" fill="#ffffff" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.8;0.05" dur="5.4s" begin="0.2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="28;20;28" dur="7.4s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="818" cy="19" r="1.5" fill="#ffffff" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.8;0.05" dur="3.3s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="19;11;19" dur="5.3s" begin="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="416" cy="194" r="1.5" fill="#ffffff" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.8;0.05" dur="3.8s" begin="2.9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="194;186;194" dur="5.8s" begin="2.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="610" cy="125" r="1.7" fill="#ffffff" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.8;0.05" dur="2.9s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="125;117;125" dur="4.9s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="56" cy="46" r="1.2" fill="#ffffff" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.8;0.05" dur="3.3s" begin="2.7s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="46;38;46" dur="5.3s" begin="2.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="817" cy="172" r="1.6" fill="#ffffff" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.8;0.05" dur="3.8s" begin="3.3s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="172;164;172" dur="5.8s" begin="3.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="607" cy="101" r="1.2" fill="#ffffff" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.8;0.05" dur="3.7s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="101;93;101" dur="5.7s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="364" cy="186" r="1.6" fill="#ffffff" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.8;0.05" dur="2.6s" begin="1.1s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="186;178;186" dur="4.6s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="183" r="1.4" fill="#ffffff" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.8;0.05" dur="4.6s" begin="1.3s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="183;175;183" dur="6.6s" begin="1.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="574" cy="158" r="1.3" fill="#ffffff" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.8;0.05" dur="4.6s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="158;150;158" dur="6.6s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="871" cy="158" r="1.0" fill="#ffffff" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.8;0.05" dur="2.9s" begin="1.9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="158;150;158" dur="4.9s" begin="1.9s" repeatCount="indefinite"/>
    </circle>

    <!-- glare sweep -->
    <g>
      <rect x="-160" y="-84.4" width="90" height="379.8" fill="url(#glare)" transform="rotate(18)"/>
      <animateTransform attributeName="transform" type="translate" values="-100 0;1200 0;1200 0" keyTimes="0;0.35;1" dur="7s" begin="3.9s" repeatCount="indefinite"/>
    </g>

    <!-- icon + title -->
    <rect x="32" y="26" width="52" height="52" rx="14" fill="url(#iconbg)">
      <animate attributeName="opacity" values="1;0.8;1" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="58" y="61" text-anchor="middle" font-size="26">🛍️</text>
    <text x="100" y="62" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="0.5" fill="url(#shine)">CatalogCraft AI</text>

    <!-- description -->
    <text x="32" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#c9d1d9">Enterprise AI platform that takes structured retail product data and generates accurate,</text>
    <text x="32" y="129" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#c9d1d9">engaging, consistent, SEO-optimized product descriptions.</text>

    <!-- tech chips -->
    <g>
      <rect x="32" y="153" width="93" height="26" rx="13" fill="#ec4899" fill-opacity="0.14" stroke="#f9a8d4" stroke-opacity="0.35">
        <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="5s" begin="0.0s" repeatCount="indefinite"/>
      </rect>
      <text x="78.5" y="170.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#ede9fe">TypeScript</text>
    </g>
    <g>
      <rect x="133" y="153" width="65" height="26" rx="13" fill="#ec4899" fill-opacity="0.14" stroke="#f9a8d4" stroke-opacity="0.35">
        <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="5s" begin="0.35s" repeatCount="indefinite"/>
      </rect>
      <text x="165.5" y="170.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#ede9fe">Python</text>
    </g>
    <g>
      <rect x="206" y="153" width="79" height="26" rx="13" fill="#ec4899" fill-opacity="0.14" stroke="#f9a8d4" stroke-opacity="0.35">
        <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="5s" begin="0.7s" repeatCount="indefinite"/>
      </rect>
      <text x="245.5" y="170.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#ede9fe">React 19</text>
    </g>
    <g>
      <rect x="293" y="153" width="93" height="26" rx="13" fill="#ec4899" fill-opacity="0.14" stroke="#f9a8d4" stroke-opacity="0.35">
        <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="5s" begin="1.05s" repeatCount="indefinite"/>
      </rect>
      <text x="339.5" y="170.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#ede9fe">SQLAlchemy</text>
    </g>
    <g>
      <rect x="394" y="153" width="65" height="26" rx="13" fill="#ec4899" fill-opacity="0.14" stroke="#f9a8d4" stroke-opacity="0.35">
        <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="5s" begin="1.4s" repeatCount="indefinite"/>
      </rect>
      <text x="426.5" y="170.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#ede9fe">SQLite</text>
    </g>

    <!-- orbit decoration -->
    <circle cx="812" cy="117" r="58" fill="none" stroke="#f9a8d4" stroke-opacity="0.35" stroke-dasharray="3 9">
      <animateTransform attributeName="transform" type="rotate" from="0 812 117" to="360 812 117" dur="24s" repeatCount="indefinite"/>
    </circle>
    <circle cx="812" cy="117" r="38" fill="#ec4899" fill-opacity="0.10" stroke="#f9a8d4" stroke-opacity="0.35">
      <animate attributeName="r" values="38;42;38" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <g>
      <circle cx="870" cy="117" r="4.5" fill="#f9a8d4"/>
      <circle cx="870" cy="117" r="9" fill="#f9a8d4" opacity="0.25"/>
      <animateTransform attributeName="transform" type="rotate" from="0 812 117" to="360 812 117" dur="7s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="774" cy="117" r="3" fill="#ffffff" opacity="0.8"/>
      <animateTransform attributeName="transform" type="rotate" from="360 812 117" to="0 812 117" dur="5s" repeatCount="indefinite"/>
    </g>
    <text x="812" y="131" text-anchor="middle" font-size="38">🛍️
      <animate attributeName="y" values="131;126;131" dur="3.2s" repeatCount="indefinite"/>
    </text>

    <!-- status -->
    <g>
      <rect x="768" y="22" width="100" height="28" rx="14" fill="#ec4899" fill-opacity="0.12" stroke="#f9a8d4" stroke-opacity="0.5"/>
      <path d="M786 36 l5 -5 l5 5 l-5 5 z" fill="#f9a8d4">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
      </path>
      <text x="803" y="40.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="1.2" fill="#ffffff">SOURCE</text>
    </g>
  </g>

  <!-- border + running comet -->
  <rect x="0.5" y="0.5" width="899" height="210" rx="18" fill="none" stroke="#30363d"/>
  <rect x="1" y="1" width="898" height="209" rx="17" fill="none" stroke="url(#edge)" stroke-width="6" pathLength="1000" stroke-dasharray="110 890" filter="url(#glow)" opacity="0.7">
    <animate attributeName="stroke-dashoffset" values="0;-1000" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="1" y="1" width="898" height="209" rx="17" fill="none" stroke="url(#edge)" stroke-width="2" pathLength="1000" stroke-dasharray="110 890">
    <animate attributeName="stroke-dashoffset" values="0;-1000" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="24" viewBox="0 0 900 24" role="img" aria-label="divider">
  <defs>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8B5CF6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="comet" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect x="0" y="11" width="900" height="2" fill="url(#fade)"/>
  <g>
    <rect x="-140" y="10" width="140" height="4" fill="url(#comet)" filter="url(#glow)"/>
    <rect x="-140" y="11" width="140" height="2" fill="url(#comet)"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="1040 0" dur="3.4s" repeatCount="indefinite"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="232" viewBox="0 0 900 232" role="img" aria-label="FINORA AI project card">
  <title>FINORA AI</title>
  <defs>
    <clipPath id="round"><rect width="900" height="232" rx="18"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3.5"/></filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.10"/>
    </pattern>
    <radialGradient id="spot">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glare" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.5" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="320" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#c4b5fd"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="0.6" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#ffffff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="320 0" dur="3.6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="iconbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#round)">
    <rect width="900" height="232" fill="#0d1117"/>

    <!-- aurora -->
    <g filter="url(#blur)">
      <ellipse cx="160" cy="81.19999999999999" rx="190" ry="70" fill="#8B5CF6" opacity="0.30">
        <animate attributeName="cx" values="160;620;160" dur="13s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="81.19999999999999;139.2;81.19999999999999" dur="9s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="760" cy="174.0" rx="170" ry="60" fill="#c4b5fd" opacity="0.18">
        <animate attributeName="cx" values="760;260;760" dur="15s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <rect width="900" height="232" fill="url(#dots)"/>

    <!-- moving spotlight -->
    <circle cx="150" cy="116.0" r="190" fill="url(#spot)">
      <animate attributeName="cx" values="120;780;120" dur="11s" repeatCount="indefinite"/>
    </circle>

    <circle cx="157" cy="157" r="1.5" fill="#ffffff" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.8;0.05" dur="4.8s" begin="1.0s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="157;149;157" dur="6.8s" begin="1.0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="527" cy="206" r="1.1" fill="#ffffff" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.8;0.05" dur="4.5s" begin="3.2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="206;198;206" dur="6.5s" begin="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="116" cy="136" r="0.7" fill="#ffffff" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.8;0.05" dur="5.0s" begin="1.7s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="136;128;136" dur="7.0s" begin="1.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="208" r="0.7" fill="#ffffff" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.8;0.05" dur="3.8s" begin="2.9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="208;200;208" dur="5.8s" begin="2.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="254" cy="163" r="1.6" fill="#ffffff" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.8;0.05" dur="5.2s" begin="0.1s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="163;155;163" dur="7.2s" begin="0.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="46" cy="178" r="1.2" fill="#ffffff" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.8;0.05" dur="5.3s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="178;170;178" dur="7.3s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="241" cy="120" r="1.4" fill="#ffffff" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.8;0.05" dur="4.1s" begin="3.1s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="120;112;120" dur="6.1s" begin="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="527" cy="153" r="0.9" fill="#ffffff" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.8;0.05" dur="3.2s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="153;145;153" dur="5.2s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="490" cy="86" r="1.6" fill="#ffffff" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.8;0.05" dur="3.7s" begin="3.7s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="86;78;86" dur="5.7s" begin="3.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="677" cy="37" r="0.9" fill="#ffffff" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.8;0.05" dur="5.5s" begin="3.4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="37;29;37" dur="7.5s" begin="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="143" cy="202" r="1.0" fill="#ffffff" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.8;0.05" dur="4.7s" begin="2.8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="202;194;202" dur="6.7s" begin="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="452" cy="141" r="1.5" fill="#ffffff" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.8;0.05" dur="4.5s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="141;133;141" dur="6.5s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="621" cy="139" r="1.5" fill="#ffffff" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.8;0.05" dur="4.0s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="139;131;139" dur="6.0s" begin="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="55" cy="134" r="0.9" fill="#ffffff" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.8;0.05" dur="4.9s" begin="1.7s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="134;126;134" dur="6.9s" begin="1.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="197" cy="105" r="1.2" fill="#ffffff" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.8;0.05" dur="4.6s" begin="2.7s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="105;97;105" dur="6.6s" begin="2.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="403" cy="34" r="1.1" fill="#ffffff" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.8;0.05" dur="4.0s" begin="3.1s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="34;26;34" dur="6.0s" begin="3.1s" repeatCount="indefinite"/>
    </circle>

    <!-- glare sweep -->
    <g>
      <rect x="-160" y="-92.80000000000001" width="90" height="417.6" fill="url(#glare)" transform="rotate(18)"/>
      <animateTransform attributeName="transform" type="translate" values="-100 0;1200 0;1200 0" keyTimes="0;0.35;1" dur="7s" begin="1.3s" repeatCount="indefinite"/>
    </g>

    <!-- icon + title -->
    <rect x="32" y="26" width="52" height="52" rx="14" fill="url(#iconbg)">
      <animate attributeName="opacity" values="1;0.8;1" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="58" y="61" text-anchor="middle" font-size="26">🎙️</text>
    <text x="100" y="62" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="0.5" fill="url(#shine)">FINORA AI</text>

    <!-- description -->
    <text x="32" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#c9d1d9">Multilingual, voice-first financial assistant that uses conversational AI to make</text>
    <text x="32" y="129" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#c9d1d9">financial literacy and government services more accessible. Built for the Murf AI –</text>
    <text x="32" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#c9d1d9">Voice for Bharat Challenge 2026 (Financial Services Track).</text>

    <!-- tech chips -->
    <g>
      <rect x="32" y="174" width="93" height="26" rx="13" fill="#8B5CF6" fill-opacity="0.14" stroke="#c4b5fd" stroke-opacity="0.35">
        <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="5s" begin="0.0s" repeatCount="indefinite"/>
      </rect>
      <text x="78.5" y="191.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#ede9fe">TypeScript</text>
    </g>
    <g>
      <rect x="133" y="174" width="65" height="26" rx="13" fill="#8B5CF6" fill-opacity="0.14" stroke="#c4b5fd" stroke-opacity="0.35">
        <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="5s" begin="0.35s" repeatCount="indefinite"/>
      </rect>
      <text x="165.5" y="191.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#ede9fe">Python</text>
    </g>
    <g>
      <rect x="206" y="174" width="72" height="26" rx="13" fill="#8B5CF6" fill-opacity="0.14" stroke="#c4b5fd" stroke-opacity="0.35">
        <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="5s" begin="0.7s" repeatCount="indefinite"/>
      </rect>
      <text x="242.0" y="191.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#ede9fe">Murf AI</text>
    </g>
    <g>
      <rect x="286" y="174" width="72" height="26" rx="13" fill="#8B5CF6" fill-opacity="0.14" stroke="#c4b5fd" stroke-opacity="0.35">
        <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="5s" begin="1.05s" repeatCount="indefinite"/>
      </rect>
      <text x="322.0" y="191.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#ede9fe">Node.js</text>
    </g>
    <g>
      <rect x="366" y="174" width="72" height="26" rx="13" fill="#8B5CF6" fill-opacity="0.14" stroke="#c4b5fd" stroke-opacity="0.35">
        <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="5s" begin="1.4s" repeatCount="indefinite"/>
      </rect>
      <text x="402.0" y="191.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#ede9fe">LiveKit</text>
    </g>

    <!-- orbit decoration -->
    <circle cx="812" cy="128" r="58" fill="none" stroke="#c4b5fd" stroke-opacity="0.35" stroke-dasharray="3 9">
      <animateTransform attributeName="transform" type="rotate" from="0 812 128" to="360 812 128" dur="24s" repeatCount="indefinite"/>
    </circle>
    <circle cx="812" cy="128" r="38" fill="#8B5CF6" fill-opacity="0.10" stroke="#c4b5fd" stroke-opacity="0.35">
      <animate attributeName="r" values="38;42;38" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <g>
      <circle cx="870" cy="128" r="4.5" fill="#c4b5fd"/>
      <circle cx="870" cy="128" r="9" fill="#c4b5fd" opacity="0.25"/>
      <animateTransform attributeName="transform" type="rotate" from="0 812 128" to="360 812 128" dur="7s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="774" cy="128" r="3" fill="#ffffff" opacity="0.8"/>
      <animateTransform attributeName="transform" type="rotate" from="360 812 128" to="0 812 128" dur="5s" repeatCount="indefinite"/>
    </g>
    <text x="812" y="142" text-anchor="middle" font-size="38">🎙️
      <animate attributeName="y" values="142;137;142" dur="3.2s" repeatCount="indefinite"/>
    </text>

    <!-- status -->
    <g>
      <rect x="784" y="22" width="84" height="28" rx="14" fill="#ff2d2d" fill-opacity="0.12" stroke="#ff2d2d" stroke-opacity="0.55"/>
      <circle cx="802" cy="36" r="4.5" fill="#ff2d2d" opacity="0.6">
        <animate attributeName="r" values="4.5;11;4.5" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0;0.6" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="802" cy="36" r="4.5" fill="#ff2d2d"/>
      <text x="814" y="40.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="1.2" fill="#ffffff">LIVE</text>
    </g>
  </g>

  <!-- border + running comet -->
  <rect x="0.5" y="0.5" width="899" height="231" rx="18" fill="none" stroke="#30363d"/>
  <rect x="1" y="1" width="898" height="230" rx="17" fill="none" stroke="url(#edge)" stroke-width="6" pathLength="1000" stroke-dasharray="110 890" filter="url(#glow)" opacity="0.7">
    <animate attributeName="stroke-dashoffset" values="0;-1000" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="1" y="1" width="898" height="230" rx="17" fill="none" stroke="url(#edge)" stroke-width="2" pathLength="1000" stroke-dasharray="110 890">
    <animate attributeName="stroke-dashoffset" values="0;-1000" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-label="Stock Market DBMS project card">
  <title>Stock Market DBMS</title>
  <defs>
    <clipPath id="round"><rect width="900" height="190" rx="18"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3.5"/></filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.10"/>
    </pattern>
    <radialGradient id="spot">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glare" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="0.5" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="320" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#14b8a6"/>
      <stop offset="0.6" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#ffffff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="320 0" dur="3.6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="iconbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#round)">
    <rect width="900" height="190" fill="#0d1117"/>

    <!-- aurora -->
    <g filter="url(#blur)">
      <ellipse cx="160" cy="66.5" rx="190" ry="70" fill="#14b8a6" opacity="0.30">
        <animate attributeName="cx" values="160;620;160" dur="13s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="66.5;114.0;66.5" dur="9s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="760" cy="142.5" rx="170" ry="60" fill="#5eead4" opacity="0.18">
        <animate attributeName="cx" values="760;260;760" dur="15s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <rect width="900" height="190" fill="url(#dots)"/>

    <!-- moving spotlight -->
    <circle cx="150" cy="95.0" r="190" fill="url(#spot)">
      <animate attributeName="cx" values="120;780;120" dur="11s" repeatCount="indefinite"/>
    </circle>

    <circle cx="261" cy="89" r="0.8" fill="#ffffff" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.8;0.05" dur="3.7s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="89;81;89" dur="5.7s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="88" cy="17" r="1.1" fill="#ffffff" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.8;0.05" dur="5.3s" begin="3.2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="17;9;17" dur="7.3s" begin="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="803" cy="27" r="0.9" fill="#ffffff" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.8;0.05" dur="4.1s" begin="1.1s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="27;19;27" dur="6.1s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="196" cy="39" r="1.0" fill="#ffffff" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.8;0.05" dur="5.3s" begin="0.1s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="39;31;39" dur="7.3s" begin="0.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="676" cy="78" r="1.5" fill="#ffffff" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.8;0.05" dur="3.1s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="78;70;78" dur="5.1s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="662" cy="107" r="0.8" fill="#ffffff" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.8;0.05" dur="4.3s" begin="2.7s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="107;99;107" dur="6.3s" begin="2.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="538" cy="75" r="0.9" fill="#ffffff" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.8;0.05" dur="3.9s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="75;67;75" dur="5.9s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="857" cy="152" r="1.5" fill="#ffffff" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.8;0.05" dur="2.5s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="152;144;152" dur="4.5s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="741" cy="91" r="1.5" fill="#ffffff" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.8;0.05" dur="4.0s" begin="1.7s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="91;83;91" dur="6.0s" begin="1.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="633" cy="85" r="1.1" fill="#ffffff" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.8;0.05" dur="3.0s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="85;77;85" dur="5.0s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="852" cy="23" r="0.8" fill="#ffffff" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.8;0.05" dur="3.9s" begin="4.0s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="23;15;23" dur="5.9s" begin="4.0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="551" cy="148" r="1.3" fill="#ffffff" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.8;0.05" dur="4.6s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="148;140;148" dur="6.6s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="709" cy="62" r="0.8" fill="#ffffff" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.8;0.05" dur="5.2s" begin="2.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="62;54;62" dur="7.2s" begin="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="471" cy="82" r="0.9" fill="#ffffff" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.8;0.05" dur="3.8s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="82;74;82" dur="5.8s" begin="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="669" cy="154" r="0.9" fill="#ffffff" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.8;0.05" dur="3.5s" begin="3.4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="154;146;154" dur="5.5s" begin="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="745" cy="70" r="1.0" fill="#ffffff" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.8;0.05" dur="4.2s" begin="3.4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="70;62;70" dur="6.2s" begin="3.4s" repeatCount="indefinite"/>
    </circle>

    <!-- glare sweep -->
    <g>
      <rect x="-160" y="-76.0" width="90" height="342.0" fill="url(#glare)" transform="rotate(18)"/>
      <animateTransform attributeName="transform" type="translate" values="-100 0;1200 0;1200 0" keyTimes="0;0.35;1" dur="7s" begin="5.2s" repeatCount="indefinite"/>
    </g>

    <!-- icon + title -->
    <rect x="32" y="26" width="52" height="52" rx="14" fill="url(#iconbg)">
      <animate attributeName="opacity" values="1;0.8;1" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="58" y="61" text-anchor="middle" font-size="26">📈</text>
    <text x="100" y="62" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="0.5" fill="url(#shine)">Stock Market DBMS</text>

    <!-- description -->
    <text x="32" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#c9d1d9">Database management system for tracking and analyzing stock market data.</text>

    <!-- tech chips -->
    <g>
      <rect x="32" y="132" width="44" height="26" rx="13" fill="#14b8a6" fill-opacity="0.14" stroke="#5eead4" stroke-opacity="0.35">
        <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="5s" begin="0.0s" repeatCount="indefinite"/>
      </rect>
      <text x="54.0" y="149.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#ede9fe">SQL</text>
    </g>
    <g>
      <rect x="84" y="132" width="65" height="26" rx="13" fill="#14b8a6" fill-opacity="0.14" stroke="#5eead4" stroke-opacity="0.35">
        <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="5s" begin="0.35s" repeatCount="indefinite"/>
      </rect>
      <text x="116.5" y="149.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#ede9fe">Python</text>
    </g>
    <g>
      <rect x="157" y="132" width="113" height="26" rx="13" fill="#14b8a6" fill-opacity="0.14" stroke="#5eead4" stroke-opacity="0.35">
        <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="5s" begin="0.7s" repeatCount="indefinite"/>
      </rect>
      <text x="213.5" y="149.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#ede9fe">DBMS Concepts</text>
    </g>

    <!-- orbit decoration -->
    <circle cx="812" cy="107" r="58" fill="none" stroke="#5eead4" stroke-opacity="0.35" stroke-dasharray="3 9">
      <animateTransform attributeName="transform" type="rotate" from="0 812 107" to="360 812 107" dur="24s" repeatCount="indefinite"/>
    </circle>
    <circle cx="812" cy="107" r="38" fill="#14b8a6" fill-opacity="0.10" stroke="#5eead4" stroke-opacity="0.35">
      <animate attributeName="r" values="38;42;38" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <g>
      <circle cx="870" cy="107" r="4.5" fill="#5eead4"/>
      <circle cx="870" cy="107" r="9" fill="#5eead4" opacity="0.25"/>
      <animateTransform attributeName="transform" type="rotate" from="0 812 107" to="360 812 107" dur="7s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="774" cy="107" r="3" fill="#ffffff" opacity="0.8"/>
      <animateTransform attributeName="transform" type="rotate" from="360 812 107" to="0 812 107" dur="5s" repeatCount="indefinite"/>
    </g>
    <text x="812" y="121" text-anchor="middle" font-size="38">📈
      <animate attributeName="y" values="121;116;121" dur="3.2s" repeatCount="indefinite"/>
    </text>

    <!-- status -->
    <g>
      <rect x="768" y="22" width="100" height="28" rx="14" fill="#14b8a6" fill-opacity="0.12" stroke="#5eead4" stroke-opacity="0.5"/>
      <path d="M786 36 l5 -5 l5 5 l-5 5 z" fill="#5eead4">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
      </path>
      <text x="803" y="40.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="1.2" fill="#ffffff">SOURCE</text>
    </g>
  </g>

  <!-- border + running comet -->
  <rect x="0.5" y="0.5" width="899" height="189" rx="18" fill="none" stroke="#30363d"/>
  <rect x="1" y="1" width="898" height="188" rx="17" fill="none" stroke="url(#edge)" stroke-width="6" pathLength="1000" stroke-dasharray="110 890" filter="url(#glow)" opacity="0.7">
    <animate attributeName="stroke-dashoffset" values="0;-1000" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="1" y="1" width="898" height="188" rx="17" fill="none" stroke="url(#edge)" stroke-width="2" pathLength="1000" stroke-dasharray="110 890">
    <animate attributeName="stroke-dashoffset" values="0;-1000" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
